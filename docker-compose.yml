name: sijil

# Local dev infra only. Backend and frontend run natively (not containerized here) for
# fast reload — see architecture doc Section 22.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sijil
      POSTGRES_PASSWORD: sijil
      POSTGRES_DB: sijil
    ports:
      - "5432:5432"
    volumes:
      - sijil_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sijil"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev (architecture doc Section 9/13) — real
  # deployments point OBJECT_STORAGE_ENDPOINT at AWS S3 / a UAE-region equivalent
  # instead.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sijil_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sijil_pgdata:
  sijil_miniodata:
