[project]
name = "sijil-backend"
version = "0.1.0"
description = "Sijil backend — AI-driven UAE trade-compliance platform (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "email-validator>=2.2",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-authored migration files — don't hand-style generated code.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "jose.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A function-scoped event loop per test (pytest-asyncio's default) breaks the
# module-level async SQLAlchemy engine (app/config/database.py) — its connection pool
# stays bound to whichever loop created it first, so the second test to touch it hits
# a dead event loop. Session-scoping keeps one loop for the whole run.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
