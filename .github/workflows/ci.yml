name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://sijil:sijil@localhost:5432/sijil_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-test-secret
  OBJECT_STORAGE_BUCKET: sijil-test
  OBJECT_STORAGE_ENDPOINT: http://localhost:9000
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_SECRET_KEY: minioadmin

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Reuses the real docker-compose.yml (Postgres/pgvector + Redis + MinIO) rather
      # than duplicating service definitions in GitHub Actions' `services:` syntax —
      # that syntax also has no way to pass MinIO's required `server /data` command.
      # The sijil_test database is created automatically by
      # docker/postgres/init-test-db.sh on this fresh container.
      - name: Start infra (Postgres, Redis, MinIO)
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app scripts tests

      - name: Apply migrations
        run: alembic upgrade head

      # Real worker process (not eager/inline execution) — the same Redis broker and
      # process boundary the document-extraction pipeline relies on in production
      # (architecture doc Section 11.1). Backend/frontend already run natively rather
      # than containerized here (docker-compose.yml), so the worker does too.
      - name: Start Celery worker
        run: |
          nohup celery -A app.workers.celery_app worker --loglevel=info --pool=solo \
            > /tmp/celery.log 2>&1 &
          for i in $(seq 1 15); do
            celery -A app.workers.celery_app inspect ping -t 2 && break
            sleep 1
          done

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      # Runs against LLM_PROVIDER=mock (the default — no secret required in CI): the
      # mock classifier picks the nearest real vector-search match, so this validates
      # retrieval quality against tests/golden_sets/baseline.json and fails the build
      # if it regresses (architecture doc Section 25). Set LLM_PROVIDER=claude with a
      # real key to also validate GRI-reasoning accuracy — that's a manual/local run,
      # not run here, to avoid real LLM cost and flakiness on every PR.
      - name: Golden-set classification regression
        run: pytest tests/golden_sets -v

      - name: Celery worker log
        if: always()
        run: cat /tmp/celery.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
