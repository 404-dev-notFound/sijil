name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sijil
          POSTGRES_PASSWORD: sijil
          POSTGRES_DB: sijil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sijil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://sijil:sijil@localhost:5432/sijil_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret
          OBJECT_STORAGE_BUCKET: sijil-test
        run: pytest tests/integration -v

      # Phase 3+: add the golden-set classification regression step here (architecture
      # doc Section 25) once ClassificationService and tests/golden_sets/ exist — it
      # should fail the build if accuracy drops below the last known-good baseline.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
